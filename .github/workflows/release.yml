name: Release
# main 에 커밋 메시지에 [release] 가 들어간 커밋을 올리거나, Actions 탭에서 직접 실행하면
# Windows exe 를 빌드하고 기존 릴리스/태그를 모두 지운 뒤 package.json 버전으로 새 릴리스를 만든다.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle renderer
        run: npm run bundle
      - name: Build Windows packages (portable exe + zip)
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: Publish this build (keep earlier releases)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER="v$(node -p "require('./package.json').version")"
          echo "새 릴리스: $VER (이전 버전은 그대로 둠)"
          # 같은 버전을 다시 올릴 때만 그 버전 하나를 지우고 새로 만듦
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "같은 버전 릴리스 교체: $VER"; gh release delete "$VER" --yes --cleanup-tag
          fi
          gh release create "$VER" dist/*.exe dist/*.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "WreckEarth $VER" --notes-file RELEASE_NOTES.md --latest
