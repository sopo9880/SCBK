name: Release
# main 에 커밋 메시지에 [release] 가 들어간 커밋을 올리거나, Actions 탭에서 직접 실행하면
# Windows exe 를 빌드하고 기존 릴리스/태그를 모두 지운 뒤 package.json 버전으로 새 릴리스를 만든다.
on:
  push:
    branches: [main, 'wip/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle renderer
        run: npm run bundle
      - name: Build Windows packages (portable exe + zip)
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: Publish this build (keep earlier releases)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER="v$(node -p "require('./package.json').version")"
          echo "새 릴리스: $VER (이전 버전은 그대로 둠)"
          # 같은 버전을 다시 올릴 때만 그 버전 하나를 지우고 새로 만듦
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "같은 버전 릴리스 교체: $VER"; gh release delete "$VER" --yes --cleanup-tag
          fi
          # 버전에 '-' 가 있으면 (예: 2.0.0-beta.1) 시험판으로 올리고 '최신' 표시는 그대로 둠
          case "$VER" in
            *-*) FLAG="--prerelease --latest=false" ;;
            *)   FLAG="--latest" ;;
          esac
          gh release create "$VER" dist/*.exe dist/*.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "WreckEarth $VER" --notes-file RELEASE_NOTES.md $FLAG

  # 맥 버전: 윈도우 쪽이 릴리스를 만든 뒤, 같은 릴리스에 맥 파일(dmg, zip)을 덧붙임
  # 애플 개발자 서명 없이 임시(ad-hoc) 서명만 하므로 처음 열 때 경고가 뜸 → 릴리스 설명 참고
  # 아직 시험 단계라 버전에 '-' 가 있는 시험판에만 만듦
  mac:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prerelease only
        id: gate
        shell: bash
        run: |
          VER="v$(node -p "require('./package.json').version")"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          case "$VER" in *-*) echo "go=1" >> "$GITHUB_OUTPUT" ;; *) echo "정식 버전이라 맥 빌드는 건너뜀"; echo "go=0" >> "$GITHUB_OUTPUT" ;; esac
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.go == '1'
      - name: Bundle renderer
        if: steps.gate.outputs.go == '1'
        run: npm run bundle
      - name: Build macOS packages (universal dmg + zip, ad-hoc signed)
        if: steps.gate.outputs.go == '1'
        run: npx electron-builder --mac --universal --publish never
      - name: Check signature
        if: steps.gate.outputs.go == '1'
        run: |
          APP=$(ls -d dist/mac-universal/*.app | head -1)
          codesign -dv "$APP" 2>&1 | head -5
          codesign --verify --deep --strict "$APP" && echo "signature ok"
          lipo -archs "$APP/Contents/MacOS/"* 
      - name: Upload to the release
        if: steps.gate.outputs.go == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd dist
          shasum -a 256 *.dmg *-mac-*.zip > SHA256SUMS-mac.txt
          cat SHA256SUMS-mac.txt
          gh release upload "${{ steps.gate.outputs.ver }}" *.dmg *-mac-*.zip SHA256SUMS-mac.txt --clobber
