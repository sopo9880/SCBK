name: PR Checks (Godot)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false
      - name: Import and parse Godot project
        run: |
          bash tools/check_godot.sh - --editor --import --quit
      - name: Validate map-data schema and input bounds
        run: python3 tools/validate_data.py
      - name: Test map projection and selection bounds (offline)
        run: |
          bash tools/check_godot.sh 'SCBK map math tests passed' --script res://tests/test_map_math.gd
      - name: Gameplay physics and terrain regression (offline)
        run: |
          bash tools/check_godot.sh 'SCBK v0.2.1 surviving collider / crater / combo regression passed.' --script res://tests/test_gameplay.gd
      - name: Offline map cache, cancellation and retry regression
        run: |
          bash tools/check_godot.sh 'SCBK v0.2.1 cache / no-false-error / cancel / retry: PASS' --script res://tests/test_map_loading.gd
      - name: Boot new game HUD and map-retry UI
        run: |
          bash tools/check_godot.sh 'SCBK v0.2.1 compact HUD + weapon dock + retry UI: PASS' --script res://tests/test_ui_shell.gd
      - name: Offline OSM projection and collidable craters
        run: |
          bash tools/check_godot.sh 'SCBK v0.2.2 offline map projection / ground crater / scorch / reset: PASS' --script res://tests/test_projection_v022.gd
      - name: Ground attacks, bat-only hit restriction and nuclear blast radius
        run: |
          bash tools/check_godot.sh 'SCBK v0.2.2 weapon ground/only-bat/adjustable nuke UI: PASS' --script res://tests/test_weapon_v022.gd
      - name: V0.2.3 8km nuke, quake, bat and measured HUD regression
        run: |
          bash tools/check_godot.sh 'SCBK v0.2.3 8km nuke / collapse cap / undo / M4-10 quake / bat / loading HUD: PASS' --script res://tests/test_cinematic_v023.gd
      - name: V0.2.3 staged cache/parser progress and continuous laser trench
        run: |
          bash tools/check_godot.sh 'SCBK v0.2.3 loader real-stage percentages / one-pass laser cut / delayed DEM: PASS' --script res://tests/test_progress_laser_v023.gd
      - name: Smoke-test scene startup (offline; 3 seconds)
        run: |
          bash tools/check_godot.sh - --quit-after 180
