name: PR Checks (Godot)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false
      - name: Import and parse Godot project
        run: godot --headless --path . --editor --import --quit
      - name: Validate map-data schema and input bounds
        run: python3 tools/validate_data.py
      - name: Test map projection and selection bounds (offline)
        run: godot --headless --path . --script res://tests/test_map_math.gd
      - name: Gameplay physics and terrain regression (offline)
        run: godot --headless --path . --script res://tests/test_gameplay.gd
      - name: Offline map cache, cancellation and retry regression
        run: godot --headless --path . --script res://tests/test_map_loading.gd
      - name: Boot new game HUD and map-retry UI
        run: godot --headless --path . --script res://tests/test_ui_shell.gd
      - name: Smoke-test scene startup (offline; 3 seconds)
        run: godot --headless --path . --quit-after 180
